name: Crypto Market Scanner

on:
  # Triggered externally by cron-job.org every hour via GitHub API.
  # Removed the built-in 'schedule' trigger because GitHub queues scheduled
  # workflows during peak hours, causing delays of up to 2+ hours.
  # cron-job.org calls workflow_dispatch directly, which runs immediately.
  workflow_dispatch:

concurrency:
  group: crypto-market-scanner-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    # Step 1: Download the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Install Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install required libraries
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run the scanner
    # The webhook URL is securely pulled from GitHub Secrets and injected
    # as an environment variable, completely hiding it from the public.
    - name: Execute Scanner
      env:
        ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        LOG_CATEGORY_ID: ${{ secrets.LOG_CATEGORY_ID }}
        COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      run: |
        python crypto_scanner.py --watchlist

    # Persist the updated CSVs on main so the next hourly run starts with the
    # complete history instead of relying on an evictable Actions cache.
    - name: Commit market history
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f data/history/market_candles.csv data/history/scan_decisions.csv
        if git diff --cached --quiet; then
          echo "No history changes to commit."
        else
          git commit -m "Update crypto scan history"
          git push
        fi
